{{- /* Renders a dated post list in the theme's blog-posts style.
       Takes a page collection: {{ partial "post-list.html" $pages }} */ -}}
<ul class="blog-posts">
  {{- range . }}
  <li>
    <span class="ungrouped">
      <i>
        <time datetime='{{ .Date.Format "2006-01-02" }}' pubdate>
          {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
        </time>
      </i>
    </span>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{- end }}
</ul>
